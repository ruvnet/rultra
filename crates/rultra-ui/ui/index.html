<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rultra · console</title>
<style>
:root{
  --rv-bg:#020205; --rv-gold:#e8a634; --rv-gold-dim:rgba(232,166,52,.15);
  --rv-gold-glow:rgba(232,166,52,.35); --rv-surface:rgba(255,255,255,.025);
  --rv-surface-light:rgba(255,255,255,.045); --rv-border:rgba(255,255,255,.06);
  --rv-border-light:rgba(255,255,255,.12); --rv-text:#f5f3f0;
  --rv-text-2:rgba(255,255,255,.75); --rv-text-3:rgba(255,255,255,.45);
  --ok:#3fb950; --warn:#d29922; --off:#6e7681; --bad:#f85149;
  --sidebar:232px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--rv-bg); color:var(--rv-text);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* ambient gold wash, very subtle — the ruOS look */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  /* Promoted to its own layer so scrolling the main column never repaints it. */
  will-change:transform; transform:translateZ(0);
  background:radial-gradient(1100px 620px at 78% -8%, rgba(232,166,52,.07), transparent 62%);
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(232,166,52,.35)}

.app{display:flex;height:100vh;position:relative;z-index:1}

/* ── sidebar ─────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar); flex:0 0 var(--sidebar); border-right:1px solid var(--rv-border);
  background:rgba(255,255,255,.018);
  display:flex; flex-direction:column; padding:22px 14px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 22px;}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--rv-gold),#cf8116);
  display:grid;place-items:center;color:#1a0f00;font-weight:800;font-size:15px;
  box-shadow:0 0 20px rgba(232,166,52,.30);
}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.2px}
.brand small{display:block;color:var(--rv-text-3);font-size:11px;font-weight:450;margin-top:1px}

.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{
  all:unset; display:flex; align-items:center; gap:11px; cursor:pointer;
  padding:10px 12px; border-radius:9px; color:var(--rv-text-2); font-size:13.5px;
  transition:background .18s ease, color .18s ease, transform .12s ease;
  border:1px solid transparent;
}
.nav button .ico{width:17px;text-align:center;opacity:.85;font-size:14px}
.nav button .kbd{margin-left:auto;font-size:10.5px;color:var(--rv-text-3);
  border:1px solid var(--rv-border-light);border-radius:5px;padding:1px 5px;font-family:ui-monospace,monospace}
.nav button:hover{background:var(--rv-surface-light);color:var(--rv-text)}
.nav button[aria-current="page"]{
  background:var(--rv-gold-dim); color:var(--rv-gold);
  border-color:rgba(232,166,52,.28);
}
.nav button:focus-visible{outline:2px solid var(--rv-gold);outline-offset:2px}

.side-foot{padding:12px 10px 0;border-top:1px solid var(--rv-border);margin-top:12px}
.side-foot .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--rv-text-3);padding:3px 0}
.side-foot .row b{color:var(--rv-text-2);font-weight:550;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--off)}
.dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2.4s ease-in-out infinite}
.dot.down{background:var(--bad);box-shadow:0 0 8px var(--bad)}
/* When the link is down, every number on screen is a memory, not a reading.
   Desaturating and dimming says so without hiding the last known state. */
body.stale .main .card .big,
body.stale .main .card .sub{opacity:.42;filter:saturate(.25)}
.stalebar{display:flex;align-items:center;gap:9px;margin-bottom:16px;padding:10px 14px;
  border:1px solid rgba(248,81,73,.42);background:rgba(248,81,73,.09);
  border-radius:11px;font-size:13px;color:#ffb4ae;animation:rise .3s both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── main ────────────────────────────────────────────── */
.main{flex:1;overflow-y:auto;padding:26px 30px 48px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head h2{margin:0;font-size:26px;font-weight:640;letter-spacing:-.6px}
.head p{margin:5px 0 0;color:var(--rv-text-3);font-size:13px;max-width:62ch;line-height:1.5}
.head .act{display:flex;gap:9px}

.btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:9px;font-size:13px;font-weight:550;
  border:1px solid var(--rv-border-light);color:var(--rv-text-2);
  transition:all .18s ease;
}
.btn:hover{background:var(--rv-surface-light);color:var(--rv-text);border-color:rgba(232,166,52,.3)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--rv-gold);outline-offset:2px}
.btn.gold{background:linear-gradient(135deg,#e8a634,#cf8116);color:#1a0f00;border-color:transparent}
.btn.gold:hover{background:linear-gradient(135deg,#f4b73e,#e8a634);box-shadow:0 0 18px var(--rv-gold-glow)}

/* ── cards ───────────────────────────────────────────── */
.grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card{
  /* No backdrop-filter. Blur is per-frame compositor work on every card, and
     on a Pi that dominates the frame budget for a visual effect nobody can
     name. A slightly more opaque surface reads the same against this ground. */
  position:relative;border:1px solid var(--rv-border);background:rgba(255,255,255,.038);
  border-radius:15px;padding:19px;
  transition:border-color .3s ease, box-shadow .3s ease, transform .18s ease;
  animation:rise .42s cubic-bezier(.21,1,.32,1) backwards;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(232,166,52,.22);box-shadow:0 0 24px rgba(232,166,52,.07),inset 0 1px 0 rgba(255,255,255,.03)}
.card[tabindex]:focus{
  outline:none;border-color:var(--rv-gold);
  box-shadow:0 0 0 1px var(--rv-gold), 0 0 30px rgba(232,166,52,.2);
  transform:translateY(-2px);
}
.card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--rv-text-3);font-weight:600}
.card .big{font-size:40px;font-weight:300;letter-spacing:-1.6px;margin:9px 0 2px;font-variant-numeric:tabular-nums;
  transition:color .5s ease}
.card .unit{font-size:16px;color:var(--rv-text-3);margin-left:5px;font-weight:400}
.card .sub{font-size:12.5px;color:var(--rv-text-3);line-height:1.5}
.card .sub b{color:var(--rv-text-2);font-weight:550}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.badge.working{background:rgba(63,185,80,.13);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
.badge.ctl{background:rgba(232,166,52,.13);color:var(--rv-gold);border:1px solid rgba(232,166,52,.3)}
.badge.unvalidated{background:rgba(121,192,255,.13);color:#79c0ff;border:1px solid rgba(121,192,255,.3)}
.badge.acks_but_silent{background:rgba(210,153,34,.13);color:var(--warn);border:1px solid rgba(210,153,34,.3)}
.badge.untested{background:rgba(110,118,129,.13);color:var(--off);border:1px solid rgba(110,118,129,.3)}

.spark{width:100%;height:44px;display:block;margin-top:10px;overflow:visible}
.spark-line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark-area{opacity:0;animation:fadein .8s ease .35s forwards}
@keyframes fadein{to{opacity:1}}
.spark-dot{opacity:0;animation:popin .3s cubic-bezier(.22,1.4,.36,1) .95s forwards}
@keyframes popin{from{opacity:0;r:0}to{opacity:1}}
.sparkrange{display:flex;justify-content:space-between;font-size:10.5px;color:var(--rv-text-3);
  font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:.02em}

.sonar{width:74px;height:74px;display:block;margin:2px auto 0}
.sonar-on{animation:ping 2.8s cubic-bezier(.22,1,.36,1) infinite}
@keyframes ping{0%{stroke-opacity:.85}55%{stroke-opacity:.22}100%{stroke-opacity:.85}}

.loopdiag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.loopdiag .stage{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--rv-border);background:var(--rv-surface);font-size:12px;color:var(--rv-text-3);
  animation:rise .4s cubic-bezier(.21,1,.32,1) backwards}
.loopdiag .stage .dot{width:6px;height:6px;border-radius:50%;background:var(--rv-text-3)}
.loopdiag .stage.on{border-color:rgba(232,166,52,.45);color:var(--rv-gold);background:var(--rv-gold-dim)}
.loopdiag .stage.on .dot{background:var(--rv-gold);box-shadow:0 0 8px var(--rv-gold)}
.loopdiag .arrow{color:var(--rv-text-3);font-size:12px}

/* Cards lift and gain a gold hairline at the top edge on focus, so the focused
   card is unmistakable without a heavy outline fighting the glass surface. */
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;border-radius:15px 15px 0 0;
  background:linear-gradient(90deg,transparent,rgba(232,166,52,.55),transparent);
  opacity:0;transition:opacity .3s ease}
.card:hover::before,.card[tabindex]:focus::before{opacity:1}
.card .big{transition:color .5s ease, transform .35s cubic-bezier(.22,1,.36,1)}
.card[tabindex]:focus .big{transform:translateY(-1px)}

.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.evi{margin-top:11px;padding-top:11px;border-top:1px solid var(--rv-border);
  font-size:11.5px;color:var(--rv-text-3);line-height:1.55}

/* chain */
.chain{display:flex;flex-direction:column;gap:0}
.centry{display:flex;gap:14px;padding:11px 2px;border-bottom:1px solid var(--rv-border);animation:rise .3s backwards}
.centry:last-child{border-bottom:none}
.centry .seq{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--rv-text-3);min-width:46px}
.centry .ev{font-size:12.5px;font-weight:600;min-width:104px}
.centry .dt{font-size:12px;color:var(--rv-text-3);font-family:ui-monospace,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.observed{color:var(--rv-text-2)} .ev.proposed{color:#79c0ff}
.ev.gated{color:var(--warn)} .ev.promoted{color:var(--ok)} .ev.rolled_back{color:var(--bad)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(2,2,5,.93);
  display:grid;place-items:center;z-index:60;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* The sheet must read clearly against a near-black page, so it steps up in
   value and carries a gold-tinted edge rather than relying on the border alone. */
.sheet{background:#15151d;border:1px solid rgba(232,166,52,.28);border-radius:16px;
  padding:26px 28px;max-width:560px;width:90%;
  box-shadow:0 26px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04),
             inset 0 1px 0 rgba(255,255,255,.06);
  animation:rise .28s cubic-bezier(.21,1,.32,1) both}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:650;color:var(--rv-gold)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13px;align-items:center}
.keys kbd{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--rv-surface-light);
  border:1px solid var(--rv-border-light);border-radius:6px;padding:3px 8px;color:var(--rv-gold);
  justify-self:start;white-space:nowrap}
.keys span{color:var(--rv-text-2)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#0b0b11;border:1px solid var(--rv-border-light);border-radius:11px;
  padding:11px 18px;font-size:13px;z-index:70;box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:toastin .3s cubic-bezier(.21,1,.32,1)}
.toast.err{border-color:rgba(248,81,73,.5)}
.toast.ok{border-color:rgba(63,185,80,.45)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* Screensaver. A wall-mounted console left on for hours burns a static layout
   into an LCD and lights a dark room all night. It idles into a slow, dim
   figure and returns on any input. */
#saver{position:fixed;inset:0;z-index:90;background:var(--rv-bg);
  display:grid;place-items:center;animation:fade 1.2s ease both;cursor:none}
#saver .wrap{text-align:center;animation:drift 48s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-4vw,-3vh) scale(.96)}to{transform:translate(4vw,3vh) scale(1.04)}}
#saver svg{width:min(46vmin,340px);height:auto;display:block;margin:0 auto}
#saver .ring{animation:sweep 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{stroke-opacity:.06}45%{stroke-opacity:.5}100%{stroke-opacity:.06}}
#saver .meta{margin-top:26px;font-size:13px;color:var(--rv-text-3);
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
#saver .meta b{color:var(--rv-gold);font-weight:600}
.hint{margin-top:26px;font-size:12px;color:var(--rv-text-3);display:flex;gap:16px;flex-wrap:wrap}
.hint kbd{font-family:ui-monospace,monospace;font-size:10.5px;background:var(--rv-surface-light);
  border:1px solid var(--rv-border);border-radius:5px;padding:2px 6px;color:var(--rv-text-2)}
.empty{color:var(--rv-text-3);font-size:13.5px;padding:34px;text-align:center;
  border:1px dashed var(--rv-border-light);border-radius:14px}

@media (max-width:820px){
  :root{--sidebar:64px}
  .brand h1,.brand small,.nav button span.txt,.nav button .kbd,.side-foot{display:none}
  .nav button{justify-content:center}
  .main{padding:20px 16px 40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">r</div>
      <div><h1>rultra</h1><small>console</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span><span class="dot" id="live-dot"></span>link</span><b id="foot-link">…</b></div>
      <div class="row"><span>poll</span><b id="foot-poll">—</b></div>
      <div class="row"><span>chain</span><b id="foot-chain">—</b></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const PAGES=[
 {id:'overview', icon:'◉', title:'Overview',  key:'1', blurb:'Live state of the box: thermals, light, the policy in force, and how much of the board is actually proven.'},
 {id:'devices',  icon:'▤', title:'Devices',   key:'2', blurb:'The catalog joined with a live probe. Verification is a claim about evidence — only “working” means someone saw it work.'},
 {id:'loop',     icon:'↻', title:'Loop',      key:'3', blurb:'The governed cycle: observe, propose, gate, promote or roll back. Run one and watch the decision.'},
 {id:'witness',  icon:'⛓', title:'Witness',   key:'4', blurb:'The signed, hash-chained record of every decision this box has made.'},
 {id:'hardware', icon:'▦', title:'Hardware',  key:'5', blurb:'Drive the outputs directly — the 8×8 matrix and the character LCD.'},
 {id:'toolkit',  icon:'⚗', title:'Toolkit',    key:'6', blurb:'Runnable examples, a self-test the box performs on itself, and an optional model reading of the room.'},
 {id:'tools',    icon:'⬡', title:'ruvnet',     key:'7', blurb:'The ruvnet stack on this box, probed rather than declared — and this box auditing its own accuracy claims.'},
 {id:'apps',     icon:'✦', title:'Applications',key:'8', blurb:'What this combination of sensors and tools can actually be built into, and what each one still needs.'},
 {id:'settings', icon:'⚙', title:'Settings',   key:'9', blurb:'Thresholds, bounds and security posture. Values are read from the running box, not from defaults.'},
];
let page='overview', timer=null, hist=[];
const $=s=>document.querySelector(s);

/* Token lives in sessionStorage: it survives navigation within the tab and is
   gone when the tab closes. localStorage would outlive the session on a shared
   machine, and a URL parameter would land in history and server logs. */
const TOK=()=>sessionStorage.getItem('rultra_token')||'';
function authHeaders(extra){
  const h=Object.assign({},extra||{});
  const t=TOK(); if(t)h['Authorization']='Bearer '+t;
  return h;
}
/* Connection state. A monitoring console that keeps showing the last numbers
   with a healthy indicator when the box has gone away is worse than one that
   shows nothing: it reports a reading as current that nobody has confirmed.
   Every fetch updates this, and the UI visibly degrades when it goes stale. */
const link={ok:null,lastOk:0,fails:0};
/* `hard` distinguishes the two ways a request fails. A thrown fetch is
   connection-refused or DNS failure — unambiguous, so report it at once. A
   non-2xx response may be a single transient blip, so require two before
   declaring the link down. Treating both the same made the banner and the
   footer disagree with each other. */
function markLink(ok,hard){
  if(ok){link.ok=true;link.lastOk=Date.now();link.fails=0}
  else if(hard){link.fails++;link.ok=false}
  else {link.fails++; if(link.fails>=2)link.ok=false}
  paintLink();
}
function paintLink(){
  const dot=$('#live-dot'), lab=$('#foot-link');
  if(!dot||!lab)return;
  if(link.ok===false){
    dot.classList.remove('live'); dot.classList.add('down');
    const age=link.lastOk?Math.round((Date.now()-link.lastOk)/1000):null;
    lab.textContent=age!=null?`lost ${age}s`:'offline';
    lab.style.color='var(--bad)';
    document.body.classList.add('stale');
  }else if(link.ok===true){
    dot.classList.add('live'); dot.classList.remove('down');
    lab.textContent='ok'; lab.style.color='';
    document.body.classList.remove('stale');
  }
}
/* Only repaint when the state it displays actually changes. A once-a-second
   DOM write for an unchanged label is a wakeup the Pi does not need, and it
   defeats the browser's idle throttling. */
let lastLinkPaint='';
setInterval(()=>{
  const key = link.ok===false ? 'down'+Math.round((Date.now()-link.lastOk)/1000) : String(link.ok);
  if(key!==lastLinkPaint){ lastLinkPaint=key; paintLink(); }
},1000);

const api=async(p,o)=>{
  const base=Object.assign({},o);
  let opt=Object.assign({},base); opt.headers=authHeaders(base.headers);
  let r;
  try{ r=await fetch(p,opt); }
  catch(e){ markLink(false,true); return {__offline:true}; }

  /* A stored token that the server rejects is worse than no token at all: on
     the box itself the loopback grant would have allowed the read, so a stale
     credential locks the user out of a console they are sitting in front of.
     Drop it and retry once unauthenticated before asking for anything. */
  if(r.status===401 && TOK()){
    sessionStorage.removeItem('rultra_token');
    const bare=Object.assign({},base);
    try{ r=await fetch(p,bare); }
    catch(e){ markLink(false,true); return {__offline:true}; }
  }
  if(r.status===401){markLink(true);askToken();return {__unauthorized:true}}
  markLink(r.ok,false);
  if(!r.ok)return {__offline:true};
  return r.json().catch(()=>({}));
};

let tokenPromptDismissed=false;
function askToken(msg){
  if($('#tokgate')||tokenPromptDismissed)return;
  const o=document.createElement('div'); o.className='overlay'; o.id='tokgate';
  o.innerHTML=`<div class="sheet"><h3>Console token</h3>
    <p style="color:var(--rv-text-3);font-size:13px;line-height:1.6;margin:0 0 16px">
      ${msg||'Reading needs nothing on this box. A token is required only to run cycles, drive hardware or call a model.'}</p>
    <div style="background:var(--rv-surface-light);border:1px solid var(--rv-border);border-radius:9px;
                padding:11px 13px;margin:0 0 15px;font-family:ui-monospace,monospace;font-size:11.5px;
                color:var(--rv-text-2);line-height:1.6;word-break:break-all">
      gcloud secrets versions access latest \<br>&nbsp;&nbsp;--secret=RULTRA_CONSOLE_TOKEN \<br>&nbsp;&nbsp;--project=cognitum-20260110
    </div>
    <p style="color:var(--rv-text-3);font-size:12px;margin:0 0 14px">
      Or read it on the box from <span class="mono">/etc/rultra/ui.env</span>.</p>
    <input id="tokin" type="password" placeholder="token" autocomplete="off" spellcheck="false"
      style="width:100%;padding:11px 13px;border-radius:9px;background:var(--rv-surface-light);
             border:1px solid var(--rv-border-light);color:var(--rv-text);font-size:14px;
             font-family:ui-monospace,monospace;outline:none">
    <div style="display:flex;gap:9px;margin-top:15px;justify-content:flex-end">
      <button class="btn" id="tokcancel">Continue read-only</button>
      <button class="btn gold" id="toksave">Unlock</button></div>
    <div style="margin-top:12px;font-size:11.5px;color:var(--rv-text-3);line-height:1.55">
      On the box itself you do not need one — read access is granted to local
      windows. A token is only required to run cycles or drive hardware.</div></div>`;
  document.body.appendChild(o);
  const inp=$('#tokin'); inp.focus();
  const save=()=>{
    const v=inp.value.trim(); if(!v)return;
    sessionStorage.setItem('rultra_token',v); tokenPromptDismissed=false; o.remove(); render();
  };
  $('#toksave').onclick=save;
  $('#tokcancel').onclick=close;
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter')save();
    if(e.key==='Escape')close();
  });
}

function toast(msg,kind=''){

/* The page lives in location.hash, so every section is linkable, the browser's
   own back button works, and a refresh returns you where you were instead of
   dumping you on Overview. hist[] is kept for the in-app Back control, which
   must behave the same way whether you arrived by key, click or URL. */
function go(id,push=true){
  if(!PAGES.find(p=>p.id===id))return;
  if(push&&id!==page)hist.push(page);
  page=id;
  const want='#'+id;
  if(location.hash!==want){ suppressHash=true; location.hash=want; }
  renderNav(); render();
}
let suppressHash=false;
function fromHash(){
  const id=(location.hash||'').replace(/^#/,'');
  return PAGES.find(p=>p.id===id)?id:'overview';
}
addEventListener('hashchange',()=>{
  // Ignore the echo of our own programmatic hash write; only react to a real
  // navigation (back button, pasted link, edited URL).
  if(suppressHash){ suppressHash=false; return; }
  const id=fromHash();
  if(id!==page){ page=id; renderNav(); render(); }
});
function back(){
  const p=hist.pop();
  if(p)go(p,false);
  else if(history.length>1)history.back();
  else toast('nothing to go back to');
}

/* Keep the last good page on screen and explain, rather than blanking it: the
   most recent known state is still useful, it just must not look live. */
function staleShell(){
  if($('.stalebar'))return;
  const m=$('#main'); if(!m)return;
  m.scrollTop = 0;
  const b=document.createElement('div');
  b.className='stalebar';
  b.innerHTML='<span>⚠</span><span>Lost contact with the box. Everything below is the '
             +'last known state, not a live reading.</span>';
  m.prepend(b);
}

function shell(body,actions=''){
  const p=PAGES.find(p=>p.id===page);
  $('#main').innerHTML=`
    <div class="head">
      <div><h2>${p.title}</h2><p>${p.blurb}</p></div>
      <div class="act">${actions}

        <button class="btn" onclick="refresh()" title="Refresh (r)">↻</button>
      </div>
    </div>${body}
    <div class="hint">
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>enter</kbd> activate</span>
      <span><kbd>1</kbd>–<kbd>9</kbd> jump</span>
      <span><kbd>backspace</kbd> back</span>
      <span><kbd>r</kbd> refresh</span>
      <span><kbd>?</kbd> keys</span>

  // old offset otherwise, so a short page after a long one opens part-way down

function stagger(){
  /* Only the first dozen get a staggered entrance. Beyond that the delay is
     longer than anyone waits, and animating a long witness list costs real
     frames on a Pi for motion nobody sees. */
  document.querySelectorAll('.card,.centry').forEach((c,i)=>{
    if(i<12) c.style.animationDelay=(i*26)+'ms';
    else c.style.animation='none';
  });
}

function spark(vals,color,id){
  if(!vals||vals.length<2)return '';
  const w=240,h=44,pad=4;
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const flat = mx===mn;
  /* Constant data drawn against a fallback range lands on the BOTTOM of the
     chart, which reads as "at its minimum" when it means "not changing".
     A flat series is drawn down the middle instead, and its range labels are
     suppressed because "62.8 to 62.8" is noise, not information. */
  const r=(mx-mn)||1;
  const pt=(v,i)=>[(i/(vals.length-1))*w, flat ? h/2 : h-((v-mn)/r)*(h-pad*2)-pad];
  const pts=vals.map(pt);

  /* Catmull-Rom to cubic bezier. A straight polyline makes sensor noise look
     like sharp events; a smoothed curve reads as a trend, which is what a
     sparkline is for. Tension is low so it never overshoots into implying
     values that were never measured. */
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area=`${d}L${w},${h}L0,${h}Z`;
  const last=pts[pts.length-1];
  const gid='g'+(id||Math.random().toString(36).slice(2,7));
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})" class="spark-area"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round" class="spark-line"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6"
            fill="${color}" class="spark-dot"/>
  </svg>
  ${flat?`<div class="sparkrange"><span>steady at ${fmt(mn)}</span></div>`
        :`<div class="sparkrange"><span>${fmt(mn)}</span><span>${fmt(mx)}</span></div>`}`;
}

/* A live sonar figure mirroring what the physical matrix is showing, so the
   screen and the panel agree. Rings light up to the current proximity band. */
function sonar(active){
  const rings=[26,19,12].map((r,i)=>{
    const on = active >= (3-i);
    return `<circle cx="34" cy="34" r="${r}" fill="none"
      stroke="var(--rv-gold)" stroke-opacity="${on?0.85:0.13}" stroke-width="2"
      class="${on?'sonar-on':''}" style="animation-delay:${i*180}ms"/>`;
  }).join('');
  return `<svg class="sonar" viewBox="0 0 68 68" aria-hidden="true">${rings}
    <circle cx="34" cy="34" r="4" fill="var(--rv-gold)" fill-opacity="${active>0?1:0.3}"/></svg>`;
}

/* The governed loop, drawn. Reading five stage names is slower than seeing a
   cycle, and this page is about a cycle. */
function loopDiagram(stage){
  const stages=['observe','score','gate','promote','witness'];
  return `<div class="loopdiag">${stages.map((n,i)=>`
    <div class="stage ${stage===n?'on':''}" style="animation-delay:${i*90}ms">
      <span class="dot"></span><span class="nm">${n}</span>
    </div>${i<stages.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>`;
}

  modal('Poll interval',

     ${min}–${max}. Applied directly, not through the fitness gate — the governed loop may still
     propose changing it back, which is the system working, not fighting you.</div>
     <input id="pollin" type="number" min="${min}" max="${max}" value="${cur}"
       style="width:100%;padding:11px 13px;border-radius:9px;background:var(--rv-surface-light);
              border:1px solid var(--rv-border-light);color:var(--rv-text);font-size:14px;
              font-family:ui-monospace,monospace;outline:none">`,
    { confirm:'Apply', closeLabel:'Cancel', onConfirm: async()=>{
        const v=parseInt($('#pollin').value,10);

          body:JSON.stringify({poll_interval_ms:v})});

      }});
}

      <div class="sub">signed entries · every decision this box has made</div>
    </div>
  </div>`);
  $('#foot-poll').textContent=s.poll_interval_ms+' ms';
  $('#foot-chain').textContent=s.witness_entries;
  $('#foot-link').textContent='ok'; $('#live-dot').classList.add('live');
  focusFirst();
  timer=setInterval(async()=>{ if(page!=='overview')return;
    const n=await api('/api/summary');
    series.temp.push(n.die_temp_c); series.lux.push(n.lux);
    if(series.temp.length>40){series.temp.shift();series.lux.shift()}
    // One frame, one write pass: two synchronous innerHTML writes force two
    // style recalculations, and on a Pi that is visible as a hitch.
    requestAnimationFrame(()=>{
      const cards=document.querySelectorAll('.card .big');
      if(cards[0])cards[0].innerHTML=`${fmt(n.die_temp_c)}<span class="unit">°C</span>`;
      if(cards[1])cards[1].innerHTML=`${fmt(n.lux)}<span class="unit">lux</span>`;
    });
  },3000);
}

async function renderDevices(){
  const d=await api('/api/devices');

    <div class="card" tabindex="0">
      <div class="rowhead">

}

async function renderLoop(){
  const [p,sch]=await Promise.all([api('/api/policy'),api('/api/schedule')]);
  if(p.__unauthorized)return;
  if(p.__offline)return staleShell();
  const auto=sch.timer_active;
  shell(`${loopDiagram(auto?'observe':null)}<div class="grid">
    <div class="card" tabindex="0">
      <div class="rowhead"><div class="label">Unattended</div>
        <span class="badge ${auto?'working':'untested'}">${auto?'running':'not scheduled'}</span></div>
      <div class="big" style="font-size:27px;color:${auto?'var(--ok)':'var(--rv-text-3)'}">${auto?'every 15 min':'manual only'}</div>
      <div class="sub">${auto
        ? 'A systemd timer runs the governed loop on its own. Without this the box is a tool, not an appliance.'
        : 'No timer installed — the box only improves itself when you ask it to.'}</div>
      ${sch.last_decision?`<div class="evi">last decision <b style="color:${sch.last_decision==='promoted'?'var(--ok)':'var(--bad)'}">${sch.last_decision.replace(/_/g,' ')}</b></div>`:''}
    </div>
    <div class="card" tabindex="0" data-act="cycle">
      <div class="rowhead"><div class="label">Run one cycle</div>
        <span class="badge ctl" title="needs the control token">control</span></div>
      <div class="big" style="font-size:27px">observe → gate</div>
      <div class="sub">Press <b>enter</b> to run a full governed cycle. Takes a few seconds — it samples twice and verifies a rollback.</div>
    </div>
    <div class="card" tabindex="0">
      <div class="label">Thermal band</div>
      <div class="big" style="font-size:27px">${fmt(p.thermal_comfort_c,0)} – ${fmt(p.thermal_ceiling_c,0)}<span class="unit">°C</span></div>
      <div class="sub">Below comfort it may sample faster; above ceiling it backs off. Between, it deliberately does nothing.</div>
    </div>
    <div class="card" tabindex="0">
      <div class="label">Poll bounds</div>
      <div class="big" style="font-size:27px">${p.min_poll_ms} – ${p.max_poll_ms}<span class="unit">ms</span></div>
      <div class="sub">currently <b>${p.poll_interval_ms} ms</b></div>
    </div>
  </div><div id="cycle-out" style="margin-top:16px"></div>`);
  focusFirst();
}

async function runCycle(){
  const out=$('#cycle-out');
  out.innerHTML=`<div class="card"><div class="label">running…</div>
    <div class="sub">sampling the parent, applying a candidate, verifying rollback, sampling the child</div></div>`;
  const r=await api('/api/cycle',{method:'POST'});
  if(r.error){out.innerHTML=`<div class="card"><div class="label" style="color:var(--bad)">error</div>
    <div class="sub">${r.error}</div></div>`; toast('cycle failed','err'); return;}
  const col=r.decision==='promoted'?'var(--ok)':r.decision==='rolled_back'?'var(--bad)':'var(--rv-text-2)';
  out.innerHTML=`<div class="card">
    <div class="rowhead"><div class="label">decision</div>
      <span class="badge ${r.decision==='promoted'?'working':r.decision==='rolled_back'?'acks_but_silent':'untested'}">${(r.decision||'').replace(/_/g,' ')}</span></div>
    <div class="big" style="font-size:27px;color:${col}">${(r.decision||'').replace(/_/g,' ')}</div>
    <div class="sub mono" style="margin-top:8px">${r.reason||''}</div>
    ${r.from?`<div class="sub" style="margin-top:8px">${r.from.poll_interval_ms} ms → <b>${r.to.poll_interval_ms} ms</b></div>`:''}
    <div class="evi">witness entries <b>${r.witness_entries??'—'}</b> · chain verified <b>${r.witness_verified??'—'}</b></div>
  </div>`;
  stagger(); toast('cycle: '+r.decision, r.decision==='promoted'?'ok':'');
  const s=await api('/api/summary'); $('#foot-chain').textContent=s.witness_entries;
}

async function renderWitness(){
  const c=await api('/api/chain');
  if(c.__unauthorized)return;
  if(c.__offline)return staleShell();
  if(!c.entries||!c.entries.length){
    shell(`<div class="empty">No witness entries yet. Run a cycle from the <b>Loop</b> page — press <kbd>3</kbd>.</div>`);
    return;
  }
  shell(`<div class="card"><div class="rowhead">
      <div class="label">causal record · ${c.count} entries</div>
      <span class="badge ${c.verified?'working':'untested'}">${c.verified?'chain parsed':'unverifiable'}</span></div>
    <div class="chain">${c.entries.slice().reverse().map(e=>{
      const ev=Object.assign({},e.event); const kind=ev.event; delete ev.event;
      return `<div class="centry"><span class="seq">seq ${e.seq}</span>
        <span class="ev ${kind}">${kind.replace(/_/g,' ')}</span>
        <span class="dt">${JSON.stringify(ev)}</span></div>`;
    }).join('')}</div></div>`);
  focusFirst();
}

let blOn=true;
async function act(a){
  if(!a)return;
  if(a.startsWith('go:'))return go(a.slice(3));
  if(a==='cycle')return runCycle();
  if(a==='claimcheck')return runClaimCheck();
  if(a==='selftest')return runSelftest();
  if(a==='interpret')return runInterpret();
  if(a.startsWith('example:'))return runExample(a.slice(8));
  if(a.startsWith('matrix:')){
    const pattern=a.split(':')[1];
    let text;
    if(pattern==='scroll'){const s=await api('/api/summary');text=`${fmt(s.lux,0)} LUX ${fmt(s.die_temp_c,0)}C`}
    const r=await api('/api/matrix',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({pattern,text})});
    return toast(r.ok?`matrix: ${pattern}`:(r.error||'failed'), r.ok?'ok':'err');
  }
  if(a==='lcd:write'){
    const s=await api('/api/summary');
    const r=await api('/api/lcd',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({line1:`lux ${fmt(s.lux,0)}`,line2:`cpu ${fmt(s.die_temp_c)}C`})});
    return toast(r.ok?'lcd: wrote status':(r.error||'failed'), r.ok?'ok':'err');
  }
  if(a==='lcd:backlight'){
    blOn=!blOn;
    const r=await api('/api/lcd',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({backlight:blOn})});
    return toast(r.ok?`lcd backlight ${blOn?'on':'off'}`:(r.error||'failed'), r.ok?'ok':'err');
  }
}

/* ── focus / keyboard ───────────────────────────────── */
function cards(){return [...document.querySelectorAll('[tabindex="0"]')]}
function focusFirst(){const c=cards();if(c.length)c[0].focus()}
function cols(){
  const c=cards(); if(c.length<2)return 1;
  const top=c[0].getBoundingClientRect().top;
  let n=0; for(const x of c){ if(Math.abs(x.getBoundingClientRect().top-top)<4)n++; else break }
  return Math.max(1,n);
}
function move(d){
  const c=cards(); if(!c.length)return;
  const i=c.indexOf(document.activeElement);
  if(i<0){c[0].focus();return}
  const n=cols(); let j=i;
  if(d==='right')j=i+1; if(d==='left')j=i-1;
  if(d==='down')j=i+n;  if(d==='up')j=i-n;
  if(j>=0&&j<c.length)c[j].focus();
}
/* One modal implementation for confirmations, forms and results. Each ad-hoc
   overlay is another place to get focus handling and dismissal subtly wrong. */
function modal(title, bodyHtml, opts){
  opts=opts||{};
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
    <h3>${title}</h3><div id="modal-body">${bodyHtml}</div>
    <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end">
      <button class="btn" data-close>${opts.closeLabel||'Close'}</button>
      ${opts.confirm?`<button class="btn gold" data-confirm>${opts.confirm}</button>`:''}
    </div></div>`;
  const close=()=>{o.remove();document.removeEventListener('keydown',esc,true);};
  const esc=(e)=>{ if(e.key==='Escape'){e.stopPropagation();close();} };
  document.addEventListener('keydown',esc,true);
  o.addEventListener('click',e=>{ if(e.target===o) close(); });
  document.body.appendChild(o);
  o.querySelector('[data-close]').onclick=close;
  const c=o.querySelector('[data-confirm]');
  if(c) c.onclick=async()=>{ await opts.onConfirm?.(o); close(); };
  (o.querySelector('input,button[data-confirm]')||o.querySelector('[data-close]')).focus();
  return {close, el:o};
}

function help(){
  if($('.overlay'))return;
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="sheet"><h3>Keyboard</h3><div class="keys">
    <kbd>← → ↑ ↓</kbd><span>Move between cards (grid-aware)</span>
    <kbd>enter / space</kbd><span>Activate the focused card</span>
    <kbd>1 – 9</kbd><span>Jump straight to a section</span>
    <kbd>j / k</kbd><span>Next / previous section</span>
    <kbd>backspace</kbd><span>Back to the previous section</span>
    <kbd>r</kbd><span>Refresh this page</span>
    <kbd>c</kbd><span>Run one governed cycle</span>
    <kbd>?</kbd><span>This panel</span>
    <kbd>esc</kbd><span>Close</span>
  </div></div>`;
  // Dismissing is a real choice, not a deferral: re-opening on the next poll
  // would trap someone who simply wants to read what the box already shows.
  const close=()=>{tokenPromptDismissed=true;o.remove();};
  o.onclick=(e)=>{ if(e.target===o) close(); };
  document.body.appendChild(o);
}
function refresh(){render();toast('refreshed')}

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const o=$('.overlay');
  if(e.key==='Escape'){o&&o.remove();return}
  if(o)return;
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowLeft'||k==='ArrowUp'||k==='ArrowDown'){
    e.preventDefault(); move(k.slice(5).toLowerCase()); return;
  }
  if(k==='Enter'||k===' '){const a=document.activeElement?.dataset?.act;if(a){e.preventDefault();act(a)}return}
  if(k==='Backspace'){e.preventDefault();back();return}
  if(k==='?'){e.preventDefault();help();return}
  if(k==='r'){e.preventDefault();refresh();return}
  if(k==='c'){e.preventDefault();go('loop');setTimeout(runCycle,120);return}
  const p=PAGES.find(p=>p.key===k); if(p){e.preventDefault();go(p.id);return}
  const i=PAGES.findIndex(p=>p.id===page);
  if(k==='j'){e.preventDefault();go(PAGES[(i+1)%PAGES.length].id)}
  if(k==='k'){e.preventDefault();go(PAGES[(i-1+PAGES.length)%PAGES.length].id)}
});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-act]'); if(c){c.focus();act(c.dataset.act)}
});
page=fromHash();
/* ── screensaver ─────────────────────────────────────────────────────── */
const SAVER_AFTER_MS = 60*60*1000;   // one hour
let idleTimer=null, saverOn=false;

function showSaver(){
  if(saverOn||$('#saver'))return;
  saverOn=true;
  const d=document.createElement('div'); d.id='saver';
  d.innerHTML=`<div class="wrap">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      ${[52,40,28,16].map((r,i)=>`<circle cx="60" cy="60" r="${r}" fill="none"
        stroke="var(--rv-gold)" stroke-width="1.4" class="ring"
        style="animation-delay:${i*700}ms"/>`).join('')}
      <circle cx="60" cy="60" r="4" fill="var(--rv-gold)" fill-opacity=".75"/>
    </svg>
    <div class="meta" id="saver-meta">rultra</div></div>`;
  document.body.appendChild(d);

  /* Keep showing live readings while idle — a screensaver on an instrument
     should still be an instrument. Slowly, because nobody is reading it. */
  const tick=async()=>{
    if(!saverOn)return;
    const s=await api('/api/summary');
    const m=$('#saver-meta');
    if(m&&!s.__offline&&!s.__unauthorized){
      m.innerHTML=`<b>${fmt(s.die_temp_c)}</b> °C &nbsp;·&nbsp; <b>${fmt(s.lux)}</b> lux
        &nbsp;·&nbsp; <b>${s.witness_entries}</b> signed`;
    }
    if(saverOn) setTimeout(tick, 30000);
  };
  tick();
}

function hideSaver(){
  const d=$('#saver'); if(d)d.remove();
  saverOn=false;
}

function resetIdle(){
  if(saverOn) hideSaver();
  clearTimeout(idleTimer);
  idleTimer=setTimeout(showSaver, SAVER_AFTER_MS);
}
['mousemove','mousedown','keydown','wheel','touchstart'].forEach(ev=>
  addEventListener(ev, resetIdle, {passive:true}));
resetIdle();

page=fromHash();
renderNav(); render();
</script>
