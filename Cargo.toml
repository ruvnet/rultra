[workspace]
resolver = "2"
members = ["crates/rultra-sense", "crates/rultra-score", "crates/rultra-evolve", "crates/rultra-witness", "crates/rultra", "crates/rultra-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/ruvnet/rultra"
authors = ["ruvnet"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
