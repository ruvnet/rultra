<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">

  <rect fill="#0d1117" x="0" y="0" width="940" height="580" rx="10"/>
  <rect fill="#161b22" x="0" y="0" width="940" height="34" rx="10"/>
  <rect fill="#161b22" x="0" y="24" width="940" height="10"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text fill="#c9d1d9" font-size="12.5" x="470" y="21" text-anchor="middle">pi@raspberrypi — rultra</text>

  <g font-size="13.5">
    <text x="22" y="64"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">sudo rultra-sense probe</tspan></text>

    <text x="22" y="90"><tspan fill="#8b949e">{</tspan><tspan fill="#79c0ff">"device"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"light"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"verification"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3fb950">"working"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"detail"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"ACK at 0x5c"</tspan><tspan fill="#8b949e">}</tspan></text>
    <text x="22" y="112"><tspan fill="#8b949e">{</tspan><tspan fill="#79c0ff">"device"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"matrix"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"verification"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3fb950">"working"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"detail"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"/dev/spidev0.1 present"</tspan><tspan fill="#8b949e">}</tspan></text>
    <text x="22" y="134"><tspan fill="#8b949e">{</tspan><tspan fill="#79c0ff">"device"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"lcd"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"verification"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#d29922">"acks_but_silent"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"detail"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"ACK at 0x21"</tspan><tspan fill="#8b949e">}</tspan></text>
    <text x="22" y="156"><tspan fill="#8b949e">{</tspan><tspan fill="#79c0ff">"device"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"buttons"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"verification"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#6e7681">"untested"</tspan><tspan fill="#8b949e">,</tspan><tspan fill="#79c0ff">"detail"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"gpiochip0"</tspan><tspan fill="#8b949e">}</tspan></text>

    <text x="22" y="186" fill="#8b949e">« three genuinely different states — and only one of them means "works" »</text>

    <text x="22" y="224"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">sudo rultra cycle</tspan>   <tspan fill="#8b949e"># box is at 83.6 °C under load</tspan></text>

    <text x="22" y="252"><tspan fill="#8b949e">{</tspan></text>
    <text x="40" y="274"><tspan fill="#79c0ff">"decision"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#f85149">"rolled_back"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="40" y="296"><tspan fill="#79c0ff">"from"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#8b949e">{</tspan> <tspan fill="#79c0ff">"poll_interval_ms"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#a5d6ff">1000</tspan> <tspan fill="#8b949e">},</tspan></text>
    <text x="40" y="318"><tspan fill="#79c0ff">"to"</tspan><tspan fill="#8b949e">:</tspan>   <tspan fill="#8b949e">{</tspan> <tspan fill="#79c0ff">"poll_interval_ms"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#a5d6ff">2000</tspan> <tspan fill="#8b949e">},</tspan></text>
    <text x="40" y="340"><tspan fill="#79c0ff">"reason"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#a5d6ff">"delta_ci=[-0.500,-0.500] beats_parent=false</tspan></text>
    <text x="121" y="362"><tspan fill="#a5d6ff">gates=false safety=0.00 rollback_verified=true"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="40" y="384"><tspan fill="#79c0ff">"witness_entries"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#a5d6ff">5</tspan><tspan fill="#8b949e">,</tspan> <tspan fill="#79c0ff">"witness_verified"</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#3fb950">true</tspan></text>
    <text x="22" y="406"><tspan fill="#8b949e">}</tspan></text>

    <text x="22" y="440"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">sudo rultra chain</tspan></text>
    <text x="22" y="466"><tspan fill="#8b949e">seq  0</tspan>  <tspan fill="#e6edf3">observed   </tspan> <tspan fill="#a5d6ff">die_temp_c 83.645</tspan></text>
    <text x="22" y="488"><tspan fill="#8b949e">seq  1</tspan>  <tspan fill="#e6edf3">proposed   </tspan> <tspan fill="#a5d6ff">poll-2000  1000ms → 2000ms</tspan></text>
    <text x="22" y="510"><tspan fill="#8b949e">seq  2</tspan>  <tspan fill="#e6edf3">observed   </tspan> <tspan fill="#a5d6ff">die_temp_c 83.590</tspan></text>
    <text x="22" y="532"><tspan fill="#8b949e">seq  3</tspan>  <tspan fill="#e6edf3">gated      </tspan> <tspan fill="#f85149">passed=false</tspan> <tspan fill="#a5d6ff">safety=0.00</tspan></text>
    <text x="22" y="554"><tspan fill="#8b949e">seq  4</tspan>  <tspan fill="#e6edf3">rolled_back</tspan> <tspan fill="#a5d6ff">verified=true</tspan>   <tspan fill="#8b949e">← signed, hash-chained</tspan></text>
  </g>
</svg>
